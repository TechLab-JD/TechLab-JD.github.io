<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" aria-hidden="true">
  <!-- Window chrome -->
  <rect x="6" y="10" width="36" height="28" rx="3" stroke="currentColor" stroke-width="2"/>
  <!-- Title bar -->
  <line x1="6" y1="18" x2="42" y2="18" stroke="currentColor" stroke-width="1.5"/>
  <!-- Window controls -->
  <circle cx="11" cy="14" r="2" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="18" cy="14" r="2" stroke="currentColor" stroke-width="1.5"/>
  <!-- Taskbar divider -->
  <line x1="6" y1="32" x2="42" y2="32" stroke="currentColor" stroke-width="1"/>
  <!-- Content lines -->
  <line x1="12" y1="23" x2="28" y2="23" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="27" x2="22" y2="27" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
</svg>
