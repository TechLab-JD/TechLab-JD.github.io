<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Résumé website</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- themes: pick one in SITE.theme ---------- */
:root{--accent:#2f5bea;--accent-soft:#e8eefe;--bg:#fbfaf7;--surface:#ffffff;--ink:#16181d;--dim:#4a4f5c;--faint:#80869a;--line:#e6e3dc;--r:16px}
[data-theme="forest"]{--accent:#1f7a55;--accent-soft:#e3f2ea}
[data-theme="plum"]{--accent:#7b3fa1;--accent-soft:#f1e8f7}
[data-theme="ember"]{--accent:#c2551f;--accent-soft:#fbeadf}
[data-mode="dark"]{--bg:#0f1117;--surface:#171a22;--ink:#eef0f5;--dim:#b4b9c7;--faint:#7c8296;--line:#262a35;--accent-soft:rgba(255,255,255,.06)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;transition:background .3s,color .3s}
a{color:var(--accent)}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
h1,h2,h3{line-height:1.15}
h1,h2{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em}

/* demo ribbon (only shows when SITE.demo is true) */
.demo{background:var(--ink);color:var(--bg);text-align:center;font-size:13px;padding:8px 16px}
.demo a{color:inherit;font-weight:600}

/* nav */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:22px;height:64px}
.brand{font-weight:700;text-decoration:none;color:var(--ink);font-size:15px}
.nav ul{display:flex;gap:20px;list-style:none;margin-left:auto}
.nav ul a{text-decoration:none;color:var(--dim);font-size:14px;font-weight:500}
.nav ul a:hover{color:var(--accent)}
.mode{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;width:36px;height:36px;cursor:pointer;font-size:15px}

/* hero */
.hero{padding:76px 0 56px;display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center}
.avatar{width:132px;height:132px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 40%,#000));
  display:grid;place-items:center;color:#fff;font:700 44px Fraunces,serif;box-shadow:0 0 0 6px var(--accent-soft)}
.hero h1{font-size:clamp(38px,6vw,60px)}
.hero .role{font-size:clamp(17px,2vw,20px);color:var(--dim);margin:6px 0 12px}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--faint);font-size:14px}
.open{display:inline-flex;align-items:center;gap:7px;color:var(--accent);font-weight:600}
.open::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:12px;font-weight:600;font-size:14.5px;text-decoration:none;border:1.5px solid var(--line);color:var(--ink);background:var(--surface);cursor:pointer;transition:transform .15s,border-color .15s}
.btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

/* sections */
section{padding:54px 0;border-top:1px solid var(--line)}
.label{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
section h2{font-size:clamp(26px,3.4vw,34px);margin-bottom:22px}
.about p{max-width:720px;color:var(--dim);font-size:17px}
.highlights{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:26px}
.hl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.hl b{display:block;font:700 28px Fraunces,serif;color:var(--accent)}
.hl span{font-size:14px;color:var(--dim)}

/* experience timeline */
.job{position:relative;padding:0 0 28px 28px;border-left:2px solid var(--line)}
.job:last-child{padding-bottom:0}
.job::before{content:'';position:absolute;left:-8px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--accent)}
.job h3{font-size:18px}
.job .at{color:var(--dim);font-weight:500}
.job .when{font-size:13px;color:var(--faint);margin:2px 0 8px;font-weight:500}
.job ul{padding-left:18px;color:var(--dim)}
.job li{margin-bottom:4px}

/* skills + certs */
.skillgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.card h3{font-size:16px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13.5px;padding:5px 12px;border-radius:999px;background:var(--accent-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--accent) 18%,transparent)}
.certs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.cert{display:flex;gap:14px;align-items:flex-start}
.cert .ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.cert h3{font-size:15.5px;margin:0}
.cert span{font-size:13.5px;color:var(--faint)}

/* projects */
.projects{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.proj{display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,border-color .15s;padding:0;overflow:hidden;text-align:left;font:inherit;color:inherit}
.proj:hover{transform:translateY(-3px);border-color:var(--accent)}
.thumb{aspect-ratio:16/9;background:linear-gradient(135deg,var(--accent-soft),color-mix(in srgb,var(--accent) 35%,var(--surface)));display:grid;place-items:center;
  font:700 22px Fraunces,serif;color:var(--accent);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.proj .body{padding:18px 20px 20px}
.proj h3{font-size:17px;margin-bottom:6px}
.proj p{font-size:14.5px;color:var(--dim)}
.proj .chips{margin-top:12px}
.proj .chip{font-size:12px;padding:3px 10px}

/* project modal */
dialog{border:0;border-radius:20px;padding:0;max-width:820px;width:calc(100% - 28px);background:var(--surface);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,12,18,.6);backdrop-filter:blur(3px)}
.slides{position:relative;aspect-ratio:16/9;background:var(--accent-soft);overflow:hidden}
.track{display:flex;height:100%;transition:transform .45s ease}
.track>*{flex:0 0 100%;height:100%;object-fit:cover}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:18px;cursor:pointer}
.arrow.prev{left:12px}.arrow.next{right:12px}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5)}
.dots i.on{background:#fff}
.mbody{padding:24px 26px 26px}
.mbody p{color:var(--dim);margin:8px 0 16px}
.x{position:absolute;top:12px;right:12px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer}

/* education, testimonials, contact */
.edu{display:grid;gap:12px}
.edu .card{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.edu span{color:var(--faint);font-size:14px}
.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.quote p{font-family:Fraunces,serif;font-size:18px;line-height:1.5}
.quote span{display:block;margin-top:12px;font-size:14px;color:var(--faint)}
.contact{text-align:center;padding:72px 0}
.contact p{color:var(--dim);max-width:560px;margin:0 auto}
.contact .btns{justify-content:center}
footer{border-top:1px solid var(--line);padding:24px 0;font-size:13px;color:var(--faint)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
footer a{color:inherit}

.rv{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
.rv.in{opacity:1;transform:none}

@media (max-width:720px){
  .nav ul{display:none}
  .mode{margin-left:auto}
  .hero{grid-template-columns:1fr;text-align:left;padding-top:48px}
  .avatar{width:96px;height:96px;font-size:32px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
/* prints as a clean one-column résumé */
@media print{
  header,.demo,.btns,.mode,.contact .btns,footer,dialog,.thumb{display:none!important}
  body{background:#fff;color:#000;font-size:11pt}
  section{padding:14px 0;border:0;break-inside:avoid}
  .rv{opacity:1;transform:none}
  .card,.hl{border:1px solid #ccc;box-shadow:none}
  .hero{padding:0 0 10px}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ======================================================================
   EDIT HERE: everything on the page comes from this one block.
   Leave a list empty ([]) and its section disappears.
   ====================================================================== */
const SITE = {
  demo: true,                       // shows the "sample site" ribbon; set false for real clients
  theme: "navy",                    // navy | forest | plum | ember
  name: "Alex Rivera",
  initials: "AR",
  photo: "",                        // e.g. "photo.jpg"; blank = initials avatar
  role: "Operations Manager → Full-Stack Web Developer",
  location: "Dallas, TX",
  openTo: "Open to full-time web developer roles",
  resumePdf: "",                    // e.g. "Alex-Rivera-Resume.pdf"; blank hides the button
  email: ["alex", "example.com"],   // split so bots can't scrape it; blank array hides the button
  links: [["LinkedIn", "https://www.linkedin.com/"], ["GitHub", "https://github.com/"]],
  about: "I spent six years running busy operations teams before moving into web development. I build fast, accessible websites and small tools that make everyday work easier, and I still think like an ops manager: clear process, clean handoffs, and nothing left half-done.",
  highlights: [["6 yrs", "leading operations teams"], ["12", "websites shipped"], ["30%", "faster internal workflows"]],
  experience: [
    {title: "Web Developer", org: "Freelance", when: "2024 – Present", points: ["Design and launch websites for local small businesses", "Set up booking, contact and analytics tools owners can manage themselves"]},
    {title: "Operations Manager", org: "Northwind Logistics", when: "2019 – 2024", points: ["Led a 25-person team across two shifts", "Built internal tracking tools that cut daily reporting time by 30%"]},
  ],
  skills: [
    ["Development", ["HTML & CSS", "JavaScript", "React", "Node.js", "Git & GitHub", "Accessibility"]],
    ["Operations", ["Team leadership", "Process design", "Scheduling", "KPI reporting", "Training"]],
  ],
  certs: [["Responsive Web Design", "freeCodeCamp · 2024"], ["Google Project Management Certificate", "Google · 2023"]],
  projects: [
    {title: "Bakery Ordering Site", blurb: "Online menu and pickup ordering for a neighborhood bakery.", details: "Built a fast static site with a menu the owner updates from a spreadsheet, plus a pickup-order form that lands in their inbox. Mobile-first, loads in under a second.", tags: ["HTML", "CSS", "JS"], link: "", images: []},
    {title: "Shift Swap Board", blurb: "A simple tool for staff to trade shifts without group-chat chaos.", details: "Replaced a messy group chat with a board where staff post and claim shifts and managers approve with one click.", tags: ["React", "Node.js"], link: "", images: []},
    {title: "Inventory Dashboard", blurb: "Live stock levels and low-stock alerts for a small warehouse.", details: "Pulls counts from a shared sheet and highlights what to reorder this week. Saved the team about two hours of manual counting a week.", tags: ["JavaScript", "Charts"], link: "", images: []},
  ],
  education: [["B.S. Business Administration", "University of North Texas · 2018"]],
  testimonials: [],                 // only real, permission-given quotes: [["quote text", "Name, Title at Company"]]
  credit: true,                     // small "Site by Vectoral Labs" footer link
};

/* ===================== rendering (no need to edit below) ===================== */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chips = a => `<div class="chips">${a.map(x => `<span class="chip">${esc(x)}</span>`).join("")}</div>`;
const sec = (id, label, title, inner, cls = "") => `<section id="${id}" class="${cls}"><div class="wrap"><div class="label">${label}</div><h2>${title}</h2>${inner}</div></section>`;
document.documentElement.dataset.theme = SITE.theme;
document.title = `${SITE.name} | ${SITE.role.split("→").pop().trim()}`;
document.querySelector("meta[name=description]").content = `${SITE.name}: ${SITE.role}. ${SITE.location}.`;

const nav = [["about","About"],["experience","Experience"],["skills","Skills"],["projects","Projects"],["contact","Contact"]]
  .filter(([id]) => id !== "projects" || SITE.projects.length);
const emailBtn = SITE.email.length ? `<button class="btn primary" type="button" data-mail>Email me</button>` : "";
const linkBtns = SITE.links.map(([n, u]) => `<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>`).join("");

let html = "";
if (SITE.demo) html += `<div class="demo">Sample site: Alex is a made-up person. Want a site like this for you? <a href="https://vectoral-labs.com">Vectoral Labs builds them →</a></div>`;
html += `<header><div class="wrap nav"><a class="brand" href="#top">${esc(SITE.name)}</a>
  <ul>${nav.map(([id, n]) => `<li><a href="#${id}">${n}</a></li>`).join("")}</ul>
  <button class="mode" type="button" aria-label="Toggle dark mode">◐</button></div></header><main id="top">`;

html += `<div class="wrap hero">
  ${SITE.photo ? `<img class="avatar" src="${esc(SITE.photo)}" alt="${esc(SITE.name)}">` : `<div class="avatar" aria-hidden="true">${esc(SITE.initials)}</div>`}
  <div><h1>${esc(SITE.name)}</h1><div class="role">${esc(SITE.role)}</div>
    <div class="meta"><span>📍 ${esc(SITE.location)}</span>${SITE.openTo ? `<span class="open">${esc(SITE.openTo)}</span>` : ""}</div>
    <div class="btns">${emailBtn}${SITE.resumePdf ? `<a class="btn" href="${esc(SITE.resumePdf)}" download>Download résumé</a>` : ""}${linkBtns}</div></div></div>`;

html += sec("about", "About", "Hello, I'm " + esc(SITE.name.split(" ")[0]),
  `<div class="about"><p>${esc(SITE.about)}</p></div>` +
  (SITE.highlights.length ? `<div class="highlights">${SITE.highlights.map(([b, s]) => `<div class="hl rv"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join("")}</div>` : ""));

if (SITE.experience.length) html += sec("experience", "Experience", "Where I've worked",
  SITE.experience.map(j => `<div class="job rv"><h3>${esc(j.title)} <span class="at">· ${esc(j.org)}</span></h3><div class="when">${esc(j.when)}</div>
    <ul>${j.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>`).join(""));

if (SITE.skills.length) html += sec("skills", "Skills", "What I bring",
  `<div class="skillgroups">${SITE.skills.map(([g, list]) => `<div class="card rv"><h3>${esc(g)}</h3>${chips(list)}</div>`).join("")}</div>` +
  (SITE.certs.length ? `<h3 style="margin:30px 0 14px;font-size:18px">Certifications</h3><div class="certs">${SITE.certs.map(([n, d]) =>
    `<div class="card cert rv"><div class="ic">✓</div><div><h3>${esc(n)}</h3><span>${esc(d)}</span></div></div>`).join("")}</div>` : ""));

if (SITE.projects.length) html += sec("projects", "Projects", "Things I've built",
  `<div class="projects">${SITE.projects.map((p, i) => `<button class="card proj rv" type="button" data-proj="${i}">
    <div class="thumb">${p.images[0] ? `<img src="${esc(p.images[0])}" alt="" loading="lazy">` : esc(p.title.split(" ").map(w => w[0]).join("").slice(0, 3))}</div>
    <div class="body"><h3>${esc(p.title)}</h3><p>${esc(p.blurb)}</p>${chips(p.tags)}</div></button>`).join("")}</div>`);

if (SITE.education.length) html += sec("education", "Education", "Education",
  `<div class="edu">${SITE.education.map(([n, d]) => `<div class="card rv"><b>${esc(n)}</b><span>${esc(d)}</span></div>`).join("")}</div>`);

if (SITE.testimonials.length) html += sec("testimonials", "Kind words", "What people say",
  `<div class="quotes">${SITE.testimonials.map(([q, w]) => `<div class="card quote rv"><p>“${esc(q)}”</p><span>— ${esc(w)}</span></div>`).join("")}</div>`);

html += `<section id="contact" class="contact"><div class="wrap"><div class="label">Contact</div><h2>Let's talk</h2>
  <p>${esc((SITE.openTo || "Always happy to connect").replace(/[.!]?$/, "."))} The fastest way to reach me is email.</p>
  <div class="btns">${emailBtn}${linkBtns}</div></div></section></main>
  <footer><div class="wrap"><span>© ${new Date().getFullYear()} ${esc(SITE.name)}</span>
  ${SITE.credit ? `<span>Site by <a href="https://vectoral-labs.com">Vectoral Labs</a></span>` : ""}</div></footer>
  <dialog id="pm"><button class="x" type="button" aria-label="Close">✕</button><div class="slides"><div class="track"></div>
  <button class="arrow prev" type="button" aria-label="Previous">‹</button><button class="arrow next" type="button" aria-label="Next">›</button><div class="dots"></div></div>
  <div class="mbody"><h2 id="pmt"></h2><p id="pmd"></p><div id="pmc"></div><div id="pml" class="btns"></div></div></dialog>`;
document.getElementById("app").innerHTML = html;

/* email: assembled only on click, so the address never sits in the page */
document.querySelectorAll("[data-mail]").forEach(b => b.addEventListener("click", () => {
  location.href = "mailto:" + SITE.email[0] + "@" + SITE.email[1];
}));

/* dark mode, remembered per visitor */
const modeBtn = document.querySelector(".mode");
try { if (localStorage.getItem("mode") === "dark") document.documentElement.dataset.mode = "dark"; } catch (e) {}
modeBtn.addEventListener("click", () => {
  const dark = document.documentElement.dataset.mode !== "dark";
  document.documentElement.dataset.mode = dark ? "dark" : "light";
  try { localStorage.setItem("mode", dark ? "dark" : "light"); } catch (e) {}
});

/* project modal + carousel (arrows, dots, swipe, keyboard) */
const pm = document.getElementById("pm"), track = pm.querySelector(".track"), dots = pm.querySelector(".dots");
let slide = 0, count = 0, startX = 0;
function go(n) {
  slide = (n + count) % count;
  track.style.transform = `translateX(${-slide * 100}%)`;
  [...dots.children].forEach((d, i) => d.classList.toggle("on", i === slide));
}
document.querySelectorAll("[data-proj]").forEach(b => b.addEventListener("click", () => {
  const p = SITE.projects[b.dataset.proj];
  const imgs = p.images.length ? p.images.map(s => `<img src="${esc(s)}" alt="">`) :
    [`<div class="thumb" style="aspect-ratio:auto;font-size:44px">${esc(p.title)}</div>`];
  track.innerHTML = imgs.join("");
  count = imgs.length;
  dots.innerHTML = count > 1 ? imgs.map(() => "<i></i>").join("") : "";
  pm.querySelectorAll(".arrow").forEach(a => a.style.display = count > 1 ? "" : "none");
  document.getElementById("pmt").textContent = p.title;
  document.getElementById("pmd").textContent = p.details;
  document.getElementById("pmc").innerHTML = chips(p.tags);
  document.getElementById("pml").innerHTML = p.link ? `<a class="btn primary" href="${esc(p.link)}" target="_blank" rel="noopener">Visit project →</a>` : "";
  go(0);
  pm.showModal();
}));
pm.querySelector(".prev").addEventListener("click", () => go(slide - 1));
pm.querySelector(".next").addEventListener("click", () => go(slide + 1));
pm.querySelector(".x").addEventListener("click", () => pm.close());
pm.addEventListener("click", e => { if (e.target === pm) pm.close(); });
pm.addEventListener("keydown", e => { if (count > 1 && e.key === "ArrowRight") go(slide + 1); if (count > 1 && e.key === "ArrowLeft") go(slide - 1); });
track.addEventListener("touchstart", e => { startX = e.touches[0].clientX; }, {passive: true});
track.addEventListener("touchend", e => { const d = e.changedTouches[0].clientX - startX; if (count > 1 && Math.abs(d) > 50) go(slide + (d < 0 ? 1 : -1)); });

/* reveal on scroll */
const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }), {threshold: .12});
document.querySelectorAll(".rv").forEach(el => io.observe(el));
</script>
</body>
</html>
